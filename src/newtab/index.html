<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    @font-face {
      font-family: 'ABC Oracle';
      src: url('/fonts/ABCOracle-Book.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'ABC Oracle', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    body {
      background-color: #191919;
      color: #f4f3ef;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 52px 24px 24px 24px;
      overflow: hidden;
      user-select: none;
    }

    /* Top Navigation Bar matching Dia app exact layout */
    .top-nav-bar {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px;
      background: #191919;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      -webkit-app-region: drag;
    }

    /* Never show duplicate top bar if window is a standard browser window with native toolbar */
    @media (display-mode: browser) {
      .top-nav-bar {
        display: none !important;
      }
      body {
        padding-top: 24px !important;
      }
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      -webkit-app-region: no-drag;
    }

    .nav-icon-btn {
      background: transparent;
      border: none;
      color: #88888b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .nav-icon-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .nav-icon-btn:active {
      transform: scale(0.95);
    }

    /* Pinned / Recent Tabs Strip matching Dia */
    .pinned-tabs-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 14px;
      padding-left: 14px;
      border-left: 1px solid rgba(255, 255, 255, 0.07);
      -webkit-app-region: no-drag;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .pinned-tabs-strip::-webkit-scrollbar {
      display: none;
    }

    .tab-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 450;
      color: #a8a8ac;
      background: transparent;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
      max-width: 170px;
    }

    .tab-pill:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .tab-pill.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .tab-favicon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Main Center Section */
    main {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    /* Center Emblem */
    .emblem-container {
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emblem-img {
      width: 80px;
      height: 90px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      opacity: 0.95;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .emblem-container:hover .emblem-img {
      transform: scale(1.06);
      opacity: 1;
    }

    /* Search Prompt Card matching Dia exact parameters */
    .prompt-card {
      width: 100%;
      background: #2d2d2e;
      border-radius: 22px;
      padding: 16px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .prompt-card:focus-within {
      background: #2e2e30;
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.55);
    }

    /* Top Row: Search Icon + Text Input */
    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .search-icon {
      color: #78787a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 17.5px;
      color: #f4f3ef;
      font-weight: 400;
      letter-spacing: -0.015em;
      caret-color: #ffffff;
      user-select: text;
    }

    .prompt-input::placeholder {
      color: #78787a;
      font-weight: 400;
    }

    /* Bottom Row: Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-top: 2px;
    }

    /* Add tabs or files button */
    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: #bbbbbc;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 450;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .add-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .add-btn svg {
      opacity: 0.85;
    }

    /* Right actions: Mic & Submit */
    .right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: #78787a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .action-icon-btn:hover {
      color: #ffffff;
    }

    .submit-arrow-btn {
      width: 32px;
      height: 32px;
      background: #3e3f41;
      color: #88888b;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.1s ease;
    }

    .submit-arrow-btn:hover {
      background: #4a4b4e;
      color: #ffffff;
    }

    .submit-arrow-btn.active,
    .prompt-card:has(.prompt-input:not(:placeholder-shown)) .submit-arrow-btn {
      background: #ffffff;
      color: #191919;
    }

    .submit-arrow-btn:active {
      transform: scale(0.95);
    }

    /* Hidden file input for "+ Add tabs or files" */
    #file-input {
      display: none;
    }

    /* ─── Vertical Tab Sidebar on Left (handled by native Cocoa hook) ─── */
    :root {
      --vtab-width: 220px;
      --accent-color: #ffffff;
    }

    .astra-vertical-tab-sidebar,
    body.tabs-vertical .astra-vertical-tab-sidebar {
      display: none !important;
    }

    .vtab-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 14px 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 12px;
    }

    .vtab-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vtab-emblem {
      width: 24px;
      height: 24px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .vtab-brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #f4f3ef;
      white-space: nowrap;
    }

    .vtab-collapse-toggle {
      background: transparent;
      border: none;
      color: #88888b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .vtab-collapse-toggle:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f4f3ef;
    }

    .vtab-new-tab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f4f3ef;
      font-size: 12.5px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.15s ease;
    }

    .vtab-new-tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .vtab-new-tab-btn kbd {
      margin-left: auto;
      font-size: 10px;
      color: #88888b;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 4px;
      border-radius: 3px;
    }

    .vtab-section-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #71717a;
      padding: 4px 8px;
      margin-bottom: 4px;
    }

    .vtab-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }

    .vtab-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      text-decoration: none;
      color: #a1a1aa;
      font-size: 13px;
      font-weight: 450;
      transition: all 0.15s ease;
      position: relative;
    }

    .vtab-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #f4f3ef;
    }

    .vtab-item.active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: 550;
      border-left: 2.5px solid var(--accent-color);
    }

    .vtab-favicon-wrap {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .vtab-favicon-wrap svg {
      width: 15px;
      height: 15px;
    }

    .vtab-item-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vtab-close-btn {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .vtab-item:hover .vtab-close-btn {
      opacity: 1;
    }

    .vtab-close-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .vtab-footer {
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .vtab-footer-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      color: #88888b;
      text-decoration: none;
      font-size: 12px;
      transition: all 0.15s ease;
    }

    .vtab-footer-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #f4f3ef;
    }

    /* Compact mode */
    body.vtab-compact .vtab-brand-name,
    body.vtab-compact .vtab-new-tab-btn span,
    body.vtab-compact .vtab-new-tab-btn kbd,
    body.vtab-compact .vtab-section-label,
    body.vtab-compact .vtab-item-title,
    body.vtab-compact .vtab-close-btn,
    body.vtab-compact .vtab-footer-btn span {
      display: none !important;
    }

    body.vtab-compact .vtab-item,
    body.vtab-compact .vtab-new-tab-btn,
    body.vtab-compact .vtab-footer-btn {
      justify-content: center;
      padding: 8px 0;
    }
  </style>
</head>

  </header>

  <!-- Main Center Section -->
  <main>
    <div class="emblem-container">
      <img src="astra_logo.png" alt="Astra" class="emblem-img" />
    </div>

    <form class="prompt-card" id="search-form">
      <div class="input-row">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input 
          type="text" 
          id="search-input" 
          class="prompt-input" 
          placeholder="Ask anything..." 
          autofocus 
          autocomplete="off" 
          spellcheck="false"
        />
      </div>

      <div class="controls-row">
        <button type="button" class="add-btn" id="add-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add tabs or files</span>
        </button>

        <div class="right-actions">
          <button type="button" class="action-icon-btn" id="mic-btn" aria-label="Voice input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button type="submit" class="submit-arrow-btn" aria-label="Submit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </form>

    <input type="file" id="file-input" multiple />
  </main>

  <script src="newtab.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    body {
      background-color: #181819;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px 20px 24px;
      overflow: hidden;
      user-select: none;
    }

    /* Top spacer to balance layout */
    .top-spacer {
      width: 100%;
      height: 40px;
    }

    /* Main Center Section */
    main {
      width: 100%;
      max-width: 652px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -30px;
    }

    /* Center Emblem */
    .emblem-container {
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emblem-img {
      width: 77px;
      height: 62px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    /* Search Prompt Card */
    .prompt-card {
      width: 100%;
      background: #2d2d2d;
      border-radius: 20px;
      padding: 16px 18px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .prompt-card:focus-within {
      background: #2f2f2f;
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    /* Top Row: Search Icon + Text Input */
    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .search-icon {
      color: #7a7a7a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 17px;
      color: #f5f5f5;
      font-weight: 400;
      letter-spacing: -0.015em;
      caret-color: #ffffff;
      user-select: text;
    }

    .prompt-input::placeholder {
      color: #787878;
      font-weight: 400;
    }

    /* Bottom Row: Controls */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding-top: 2px;
    }

    /* Add tabs or files button */
    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #383838;
      color: #a3a3a3;
      border: none;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 450;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .add-btn:hover {
      background: #424242;
      color: #d1d1d1;
    }

    .add-btn svg {
      opacity: 0.8;
    }

    /* Right actions: Mic & Submit */
    .right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: #787878;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .action-icon-btn:hover {
      color: #b0b0b0;
    }

    .submit-arrow-btn {
      width: 30px;
      height: 30px;
      background: #383838;
      color: #787878;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }

    .submit-arrow-btn:hover {
      background: #484848;
      color: #ffffff;
    }

    .submit-arrow-btn:active {
      transform: scale(0.95);
    }

    /* Bottom Capsule Indicator */
    .bottom-indicator {
      width: 42px;
      height: 5px;
      border-radius: 9999px;
      border: 1px solid #383839;
      background: transparent;
      margin-bottom: 2px;
    }

    /* Hidden file input for "+ Add tabs or files" */
    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top spacer -->
  <div class="top-spacer"></div>

  <!-- Center Content Stage -->
  <main>
    <!-- Center Emblem -->
    <div class="emblem-container">
      <img src="logo_transparent.png" alt="Astra" class="emblem-img" />
    </div>

    <!-- Search Prompt Card -->
    <form class="prompt-card" id="search-form">
      <!-- Input Row -->
      <div class="input-row">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input 
          type="text" 
          id="search-input" 
          class="prompt-input" 
          placeholder="Ask anything..." 
          autofocus 
          autocomplete="off" 
          spellcheck="false"
        />
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <button type="button" class="add-btn" id="add-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add tabs or files</span>
        </button>

        <div class="right-actions">
          <button type="button" class="action-icon-btn" id="mic-btn" aria-label="Voice input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button type="submit" class="submit-arrow-btn" aria-label="Submit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </form>

    <input type="file" id="file-input" multiple />
  </main>

  <!-- Bottom Indicator -->
  <div class="bottom-indicator"></div>

  <script src="newtab.js"></script>
</body>
</html>

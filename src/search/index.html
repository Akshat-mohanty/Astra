<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0d14'/><path d='M16 4 L18.5 13.5 L28 16 L18.5 18.5 L16 28 L13.5 18.5 L4 16 L13.5 13.5 Z' fill='%236366f1'/></svg>">
  <style>
    :root {
      --bg: #0b0f17;
      --surface-1: #131924;
      --surface-2: #1b2332;
      --surface-3: #263145;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-tertiary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-subtle: rgba(99, 102, 241, 0.15);
      --shield-green: #10b981;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--accent);
      color: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      padding: 28px 36px;
      position: relative;
    }

    /* Header */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .star-logo {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--shield-green);
    }

    .quick-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .quick-link-btn:hover {
      background: var(--surface-2);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* Main Stage */
    main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 740px;
      margin: auto;
      text-align: center;
      padding: 40px 0;
    }

    .time-heading {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
      color: var(--text-primary);
      font-feature-settings: "tnum" 1;
    }

    .greeting-subhead {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* Command / Search Container */
    .command-container {
      width: 100%;
      position: relative;
      margin-bottom: 32px;
    }

    .command-bar {
      width: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 6px 10px 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s var(--ease-out);
    }

    .command-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
      transform: translateY(-1px);
    }

    .search-engine-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s, background 0.15s;
    }

    .search-engine-selector:hover {
      color: var(--text-primary);
      background: var(--surface-3);
    }

    .search-input {
      flex: 1;
      height: 48px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 17px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .submit-button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .submit-button:hover {
      background: var(--accent-hover);
    }

    .submit-button:active {
      transform: scale(0.96);
    }

    /* Engine Dropdown */
    .engine-dropdown {
      position: absolute;
      top: 66px;
      left: 16px;
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      padding: 6px;
      display: none;
      flex-direction: column;
      z-index: 100;
      min-width: 160px;
      text-align: left;
    }

    .engine-dropdown.open {
      display: flex;
    }

    .engine-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }

    .engine-option:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }

    .engine-option.active {
      color: var(--text-primary);
      background: var(--accent-subtle);
    }

    /* Shortcuts Grid */
    .shortcuts-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      width: 100%;
    }

    .shortcut-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s var(--ease-out), color 0.15s ease;
    }

    .shortcut-item:hover {
      background: var(--surface-2);
      border-color: var(--border-strong);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .shortcut-icon-wrapper {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .keyboard-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .key-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 7px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="chrome://newtab" class="brand-mark">
      <div class="star-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z" fill="#6366f1"/>
        </svg>
      </div>
      <span class="brand-title">Astra</span>
    </a>

    <div class="header-pills">
      <div class="status-pill">
        <span class="status-indicator"></span>
        <span>Shields Active</span>
      </div>
      <a class="quick-link-btn" href="https://chromewebstore.google.com" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>Web Store</span>
      </a>
      <a class="quick-link-btn" href="chrome://settings" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Stage -->
  <main>
    <div class="time-heading" id="clock-display">12:00</div>
    <div class="greeting-subhead" id="greeting-display">Ready to explore.</div>

    <div class="command-container">
      <form class="command-bar" id="search-form" onsubmit="executeSearch(event)">
        <button type="button" class="search-engine-selector" id="engine-btn" onclick="toggleEngineMenu(event)">
          <span id="current-engine-name">Google</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Search the web or type a URL..." 
          autofocus 
          autocomplete="off" 
          spellcheck="false"
        />

        <button type="submit" class="submit-button" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <!-- Engine Selector Menu -->
      <div class="engine-dropdown" id="engine-dropdown">
        <button type="button" class="engine-option active" onclick="selectEngine('google', 'Google')">Google</button>
        <button type="button" class="engine-option" onclick="selectEngine('duckduckgo', 'DuckDuckGo')">DuckDuckGo</button>
        <button type="button" class="engine-option" onclick="selectEngine('brave', 'Brave')">Brave</button>
        <button type="button" class="engine-option" onclick="selectEngine('github', 'GitHub')">GitHub</button>
      </div>
    </div>

    <!-- Quick Shortcuts Bar -->
    <div class="shortcuts-bar">
      <a class="shortcut-item" href="https://chromewebstore.google.com">
        <div class="shortcut-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <span>Extensions</span>
      </a>

      <a class="shortcut-item" href="https://github.com">
        <div class="shortcut-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
        </div>
        <span>GitHub</span>
      </a>

      <a class="shortcut-item" href="https://chatgpt.com">
        <div class="shortcut-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
        </div>
        <span>AI Copilot</span>
      </a>

      <a class="shortcut-item" href="https://youtube.com">
        <div class="shortcut-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"></polygon>
          </svg>
        </div>
        <span>YouTube</span>
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="keyboard-hint">
      <span>Focus search:</span>
      <span class="key-badge">/</span>
      <span>or</span>
      <span class="key-badge">⌘K</span>
    </div>
    <div>Astra Browser • Chromium Core</div>
  </footer>

  <script>
    // Live Clock & Time-based Greeting
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${hours}:${minutes}`;

      const hr = now.getHours();
      let greeting = 'Good evening';
      if (hr >= 5 && hr < 12) greeting = 'Good morning';
      else if (hr >= 12 && hr < 17) greeting = 'Good afternoon';
      document.getElementById('greeting-display').textContent = `${greeting}. Where to next?`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    // Search Engine Selection
    const engines = {
      google: 'https://www.google.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q=',
      brave: 'https://search.brave.com/search?q=',
      github: 'https://github.com/search?q='
    };
    let currentEngine = localStorage.getItem('astra_engine') || 'google';

    function initEngine() {
      const names = { google: 'Google', duckduckgo: 'DuckDuckGo', brave: 'Brave', github: 'GitHub' };
      document.getElementById('current-engine-name').textContent = names[currentEngine] || 'Google';
      document.querySelectorAll('.engine-option').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(currentEngine));
      });
    }
    initEngine();

    function toggleEngineMenu(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('engine-dropdown');
      dropdown.classList.toggle('open');
    }

    function selectEngine(id, name) {
      currentEngine = id;
      localStorage.setItem('astra_engine', id);
      document.getElementById('current-engine-name').textContent = name;
      document.getElementById('engine-dropdown').classList.remove('open');
      document.querySelectorAll('.engine-option').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(id));
      });
      document.getElementById('search-input').focus();
    }

    window.addEventListener('click', () => {
      document.getElementById('engine-dropdown').classList.remove('open');
    });

    // Execute Search or Direct Navigation
    function executeSearch(e) {
      e.preventDefault();
      const input = document.getElementById('search-input').value.trim();
      if (!input) return;

      const isUrl = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/.test(input)
                 || input.startsWith('localhost')
                 || input.includes('://');

      if (isUrl) {
        const dest = input.startsWith('http://') || input.startsWith('https://') ? input : 'https://' + input;
        window.location.href = dest;
      } else {
        const baseUrl = engines[currentEngine] || engines.google;
        window.location.href = baseUrl + encodeURIComponent(input);
      }
    }

    // Hotkey to focus search
    window.addEventListener('keydown', (e) => {
      if ((e.key === '/' || (e.metaKey && e.key === 'k')) && document.activeElement !== document.getElementById('search-input')) {
        e.preventDefault();
        document.getElementById('search-input').focus();
        document.getElementById('search-input').select();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23090a0f'/><path d='M16 6 L18.2 13.8 L26 16 L18.2 18.2 L16 26 L13.8 18.2 L6 16 L13.8 13.8 Z' fill='%23818cf8'/></svg>">
  <style>
    :root {
      --bg: #090a0f;
      --surface: #12141c;
      --surface-elevated: #181b26;
      --surface-hover: #1f2331;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(129, 140, 248, 0.5);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-faint: #94a3b8;
      --accent: #818cf8;
      --accent-press: #6366f1;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--accent);
      color: #090a0f;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 32px 40px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Corner Navigation */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
    }

    .ghost-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-faint);
      text-decoration: none;
      font-size: 13px;
      font-weight: 450;
      letter-spacing: -0.01em;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .ghost-nav-link:hover {
      color: var(--text-main);
      background: var(--surface);
    }

    /* Main Centered Stage */
    main {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      text-align: center;
    }

    /* Astra Emblem */
    .emblem-wrapper {
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .emblem-icon {
      width: 36px;
      height: 36px;
      opacity: 0.92;
      transition: opacity 0.2s ease, transform 0.2s var(--ease);
    }

    .emblem-wrapper:hover .emblem-icon {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Command Search Bar */
    .command-box {
      width: 100%;
      position: relative;
      margin-bottom: 28px;
    }

    .command-input-container {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 6px 8px 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .command-input-container:focus-within {
      background: var(--surface-elevated);
      border-color: var(--border-focus);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    }

    .engine-trigger {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .engine-trigger:hover {
      background: var(--surface-hover);
      color: var(--text-main);
      border-color: var(--border-hover);
    }

    .command-input {
      flex: 1;
      height: 44px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-main);
      letter-spacing: -0.01em;
      user-select: text;
    }

    .command-input::placeholder {
      color: var(--text-faint);
      font-weight: 400;
    }

    .command-submit {
      width: 36px;
      height: 36px;
      background: var(--accent);
      color: #090a0f;
      border: none;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .command-submit:hover {
      background: #9aa5ff;
    }

    .command-submit:active {
      transform: scale(0.95);
      background: var(--accent-press);
    }

    /* Engine Dropdown */
    .engine-menu {
      position: absolute;
      top: 58px;
      left: 12px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-md);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      padding: 4px;
      display: none;
      flex-direction: column;
      z-index: 50;
      min-width: 140px;
    }

    .engine-menu.visible {
      display: flex;
    }

    .engine-choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .engine-choice:hover {
      background: var(--surface-hover);
      color: var(--text-main);
    }

    .engine-choice.selected {
      color: var(--text-main);
      font-weight: 500;
    }

    /* Shortcuts Clean Strip */
    .shortcuts-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .shortcut-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 450;
      letter-spacing: -0.01em;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s var(--ease);
    }

    .shortcut-pill:hover {
      background: var(--surface-elevated);
      border-color: var(--border-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .shortcut-pill svg {
      opacity: 0.85;
      transition: opacity 0.15s ease;
    }

    .shortcut-pill:hover svg {
      opacity: 1;
    }

    /* Bottom Bar */
    .bottom-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .kbd-tip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .key-cap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Navigation (Right-aligned, quiet) -->
  <div class="top-nav">
    <a href="https://chromewebstore.google.com" target="_blank" class="ghost-nav-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Web Store</span>
    </a>
    <a href="chrome://settings" target="_blank" class="ghost-nav-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Settings</span>
    </a>
  </div>

  <!-- Center Stage -->
  <main>
    <!-- Minimalist Astra Emblem -->
    <div class="emblem-wrapper">
      <svg class="emblem-icon" viewBox="0 0 32 32" fill="none">
        <path d="M16 4 L18.5 13.5 L28 16 L18.5 18.5 L16 28 L13.5 18.5 L4 16 L13.5 13.5 Z" fill="#818cf8"/>
      </svg>
    </div>

    <!-- Command / Search Bar -->
    <div class="command-box">
      <form class="command-input-container" id="search-form" onsubmit="executeSearch(event)">
        <button type="button" class="engine-trigger" id="engine-btn" onclick="toggleEngineMenu(event)" aria-label="Select search engine">
          <span id="current-engine-name">Google</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <input 
          type="text" 
          id="search-input" 
          class="command-input" 
          placeholder="Search or enter address..." 
          autofocus 
          autocomplete="off" 
          spellcheck="false"
        />

        <button type="submit" class="command-submit" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <!-- Engine Selector Popover -->
      <div class="engine-menu" id="engine-menu">
        <button type="button" class="engine-choice selected" onclick="selectEngine('google', 'Google')">Google</button>
        <button type="button" class="engine-choice" onclick="selectEngine('duckduckgo', 'DuckDuckGo')">DuckDuckGo</button>
        <button type="button" class="engine-choice" onclick="selectEngine('brave', 'Brave')">Brave</button>
        <button type="button" class="engine-choice" onclick="selectEngine('github', 'GitHub')">GitHub</button>
      </div>
    </div>

    <!-- Clean Shortcuts Strip -->
    <div class="shortcuts-strip">
      <a class="shortcut-pill" href="https://github.com">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
        </svg>
        <span>GitHub</span>
      </a>

      <a class="shortcut-pill" href="https://chatgpt.com">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
        </svg>
        <span>ChatGPT</span>
      </a>

      <a class="shortcut-pill" href="https://youtube.com">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
          <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"></polygon>
        </svg>
        <span>YouTube</span>
      </a>

      <a class="shortcut-pill" href="chrome://extensions">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        </svg>
        <span>Extensions</span>
      </a>
    </div>
  </main>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="kbd-tip">
      <span>Focus</span>
      <span class="key-cap">⌘K</span>
      <span>or</span>
      <span class="key-cap">/</span>
    </div>
    <div>Astra</div>
  </div>

  <script>
    // Search Engine Configuration
    const engines = {
      google: 'https://www.google.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q=',
      brave: 'https://search.brave.com/search?q=',
      github: 'https://github.com/search?q='
    };
    let currentEngine = localStorage.getItem('astra_pref_engine') || 'google';

    function initEngine() {
      const names = { google: 'Google', duckduckgo: 'DuckDuckGo', brave: 'Brave', github: 'GitHub' };
      document.getElementById('current-engine-name').textContent = names[currentEngine] || 'Google';
      document.querySelectorAll('.engine-choice').forEach(btn => {
        btn.classList.toggle('selected', btn.getAttribute('onclick').includes(currentEngine));
      });
    }
    initEngine();

    function toggleEngineMenu(e) {
      e.stopPropagation();
      document.getElementById('engine-menu').classList.toggle('visible');
    }

    function selectEngine(id, name) {
      currentEngine = id;
      localStorage.setItem('astra_pref_engine', id);
      document.getElementById('current-engine-name').textContent = name;
      document.getElementById('engine-menu').classList.remove('visible');
      document.querySelectorAll('.engine-choice').forEach(btn => {
        btn.classList.toggle('selected', btn.getAttribute('onclick').includes(id));
      });
      document.getElementById('search-input').focus();
    }

    window.addEventListener('click', () => {
      document.getElementById('engine-menu').classList.remove('visible');
    });

    // Execute Search or Direct Navigation
    function executeSearch(e) {
      e.preventDefault();
      const input = document.getElementById('search-input').value.trim();
      if (!input) return;

      const isUrl = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/.test(input)
                 || input.startsWith('localhost')
                 || input.includes('://');

      if (isUrl) {
        const dest = input.startsWith('http://') || input.startsWith('https://') ? input : 'https://' + input;
        window.location.href = dest;
      } else {
        const baseUrl = engines[currentEngine] || engines.google;
        window.location.href = baseUrl + encodeURIComponent(input);
      }
    }

    // Keyboard navigation: / or Cmd+K to focus
    window.addEventListener('keydown', (e) => {
      if ((e.key === '/' || (e.metaKey && e.key === 'k')) && document.activeElement !== document.getElementById('search-input')) {
        e.preventDefault();
        document.getElementById('search-input').focus();
        document.getElementById('search-input').select();
      }
    });
  </script>
</body>
</html>
